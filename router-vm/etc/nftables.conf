#!/usr/sbin/nft -f

flush ruleset

table inet filter {
        chain input {
                type filter hook input priority filter; policy accept;
        }
        chain forward {
                type filter hook forward priority filter; policy drop;

                ct state established,related accept

                # host -> public-vm web (after DNAT)
                iifname "enp0s10" oifname "enp0s8" ip daddr 10.0.1.10 tcp dport 80 accept

                # public-vm -> private-vm: SSH only
                iifname "enp0s8" oifname "enp0s9" ip saddr 10.0.1.10 ip daddr 10.0.3.10 tcp dport 22 accept

                # public-vm -> private-vm: PostgreSQL only
                iifname "enp0s8" oifname "enp0s9" ip saddr 10.0.1.10 ip daddr 10.0.3.10 tcp dport 5432 accept

                # both subnets -> internet: updates + DNS + ping for testing
                iifname { "enp0s8", "enp0s9" } oifname "enp0s3" tcp dport { 80, 443, 53 } accept
                iifname { "enp0s8", "enp0s9" } oifname "enp0s3" udp dport 53 accept
                iifname { "enp0s8", "enp0s9" } oifname "enp0s3" icmp type echo-request accept
        }
        chain output {
                type filter hook output priority filter; policy accept;
        }
}

table ip nat {
        chain prerouting {
                type nat hook prerouting priority dstnat; policy accept;
                iifname "enp0s10" tcp dport 80 dnat to 10.0.1.10:80
        }
        chain postrouting {
                type nat hook postrouting priority srcnat; policy accept;
                oifname "enp0s3" masquerade
        }
}
