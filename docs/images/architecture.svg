<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mini-VPC Lab architecture</title>
  <desc>A router VM connects the internet and the host machine to a public subnet with the web tier (Nginx and a Docker container) and a private subnet with the database tier (PostgreSQL).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#475569"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#0D9488"/>
    </marker>
  </defs>

  <rect width="1100" height="760" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#111827">Mini-VPC Lab · Architecture</text>
  <text x="40" y="68" font-size="13" fill="#6B7280">AWS-style three-tier network on VirtualBox: router, public subnet (web tier), private subnet (database tier)</text>

  <!-- Outside world -->
  <rect x="130" y="92" width="250" height="56" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="255" y="114" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Internet</text>
  <text x="255" y="134" font-size="12" fill="#6B7280" text-anchor="middle">via VirtualBox NAT</text>

  <rect x="720" y="92" width="250" height="56" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="845" y="114" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Host machine (client)</text>
  <text x="845" y="134" font-size="12" fill="#6B7280" text-anchor="middle">Host-Only network 192.168.56.0/24</text>

  <!-- Lab network outline -->
  <rect x="40" y="178" width="1020" height="522" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="200" font-size="12" font-weight="700" fill="#64748B">Lab network · 10.0.0.0/16  (≈ VPC)</text>

  <!-- Arrows: outside -> router -->
  <line x1="255" y1="148" x2="345" y2="203" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="845" y1="148" x2="755" y2="203" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect x="300" y="214" width="500" height="120" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="550" y="242" font-size="18" font-weight="700" fill="#4C1D95" text-anchor="middle">router-vm</text>
  <text x="550" y="263" font-size="12" fill="#6D28D9" text-anchor="middle">≈ Internet Gateway + NAT Gateway + Security Groups</text>

  <rect x="310" y="282" width="125" height="30" rx="8" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="372.5" y="301" font-size="12" fill="#1F2937" text-anchor="middle">NAT masquerade</text>
  <rect x="447" y="282" width="170" height="30" rx="8" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="532" y="301" font-size="12" fill="#1F2937" text-anchor="middle">DNAT :80 → public-vm</text>
  <rect x="629" y="282" width="160" height="30" rx="8" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="709" y="301" font-size="12" fill="#1F2937" text-anchor="middle">nftables default-deny</text>

  <!-- Router interface labels -->
  <rect x="270" y="203" width="150" height="22" rx="11" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="345" y="218" font-size="11" fill="#4C1D95" text-anchor="middle">enp0s3 · NAT (DHCP)</text>
  <rect x="660" y="203" width="190" height="22" rx="11" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="755" y="218" font-size="11" fill="#4C1D95" text-anchor="middle">enp0s10 · 192.168.56.10</text>
  <rect x="325" y="323" width="150" height="22" rx="11" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="400" y="338" font-size="11" fill="#4C1D95" text-anchor="middle">enp0s8 · 10.0.1.1</text>
  <rect x="625" y="323" width="150" height="22" rx="11" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="700" y="338" font-size="11" fill="#4C1D95" text-anchor="middle">enp0s9 · 10.0.3.1</text>

  <!-- Arrows: router -> subnets -->
  <line x1="400" y1="345" x2="295" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="345" x2="805" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Public subnet -->
  <rect x="70" y="410" width="450" height="270" rx="14" fill="#F0FDF4" stroke="#34D399" stroke-width="1.5"/>
  <text x="92" y="436" font-size="14" font-weight="700" fill="#065F46">public-net · 10.0.1.0/24</text>
  <text x="92" y="454" font-size="12" fill="#059669">≈ public subnet</text>

  <rect x="95" y="472" width="400" height="170" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="115" y="498" font-size="14" font-weight="700" fill="#1F2937">public-vm · 10.0.1.10</text>
  <text x="115" y="516" font-size="11" fill="#6B7280">Debian 13 · 2 GB RAM · bastion host for private-vm</text>

  <rect x="115" y="530" width="170" height="96" rx="8" fill="#ECFDF5" stroke="#10B981"/>
  <text x="200" y="560" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Nginx</text>
  <text x="200" y="580" font-size="12" fill="#1F2937" text-anchor="middle">:80 reverse proxy</text>
  <text x="200" y="600" font-size="11" fill="#059669" text-anchor="middle">≈ Load Balancer (ALB)</text>

  <line x1="285" y1="578" x2="315" y2="578" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="315" y="530" width="160" height="96" rx="8" fill="#ECFDF5" stroke="#10B981"/>
  <text x="395" y="560" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Docker</text>
  <text x="395" y="580" font-size="12" fill="#1F2937" text-anchor="middle">lab-api · FastAPI</text>
  <text x="395" y="600" font-size="11" fill="#059669" text-anchor="middle">127.0.0.1:8000 · ≈ ECS</text>

  <text x="295" y="664" font-size="11" fill="#6B7280" text-anchor="middle">Inbound from outside: port 80 only (DNAT)</text>

  <!-- Private subnet -->
  <rect x="580" y="410" width="450" height="270" rx="14" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text x="602" y="436" font-size="14" font-weight="700" fill="#9A3412">private-net · 10.0.3.0/24</text>
  <text x="602" y="454" font-size="12" fill="#EA580C">≈ private subnet</text>

  <rect x="605" y="472" width="400" height="170" rx="10" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="625" y="498" font-size="14" font-weight="700" fill="#1F2937">private-vm · 10.0.3.10</text>
  <text x="625" y="516" font-size="11" fill="#6B7280">Debian 13 · 1 GB RAM · no route in from outside</text>

  <rect x="625" y="530" width="360" height="96" rx="8" fill="#FFEDD5" stroke="#F97316"/>
  <text x="805" y="560" font-size="14" font-weight="700" fill="#9A3412" text-anchor="middle">PostgreSQL 17 · :5432</text>
  <text x="805" y="580" font-size="12" fill="#1F2937" text-anchor="middle">database app_db · user app_user</text>
  <text x="805" y="600" font-size="11" fill="#EA580C" text-anchor="middle">listens on 10.0.3.10 · ≈ RDS</text>

  <text x="805" y="664" font-size="11" fill="#6B7280" text-anchor="middle">Outbound only via NAT (updates) · inbound only from public-vm</text>

  <!-- Allowed flow between the VMs -->
  <line x1="495" y1="578" x2="605" y2="578" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="550" y="562" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle">5432 · 22</text>
  <text x="550" y="598" font-size="11" fill="#0F766E" text-anchor="middle">via router</text>

  <!-- Numbered request path -->
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="800" cy="175" r="11" fill="#111827" stroke="#FFFFFF" stroke-width="2"/><text x="800" y="179.5">1</text>
    <circle cx="447" cy="282" r="11" fill="#111827" stroke="#FFFFFF" stroke-width="2"/><text x="447" y="286.5">2</text>
    <circle cx="115" cy="530" r="11" fill="#111827" stroke="#FFFFFF" stroke-width="2"/><text x="115" y="534.5">3</text>
    <circle cx="315" cy="530" r="11" fill="#111827" stroke="#FFFFFF" stroke-width="2"/><text x="315" y="534.5">4</text>
    <circle cx="625" cy="530" r="11" fill="#111827" stroke="#FFFFFF" stroke-width="2"/><text x="625" y="534.5">5</text>
  </g>

  <!-- Legend -->
  <text x="40" y="732" font-size="12" fill="#374151"><tspan font-weight="700">Request path:</tspan>  1 Client   ›   2 Router DNAT :80   ›   3 Nginx   ›   4 App container   ›   5 PostgreSQL</text>
</svg>
